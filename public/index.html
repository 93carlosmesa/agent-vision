<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Vision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Agent Vision</h1>
      <p class="subtitle">Real-time animated view of agent sessions</p>
    </div>

    <div class="header-controls">
      <label for="scene-select">Scene</label>
      <select id="scene-select">
        <option value="oficina">Office</option>
        <option value="playa">Beach</option>
      </select>

      <label for="theme-select">Skin</label>
      <select id="theme-select">
        <option value="personas">People</option>
        <option value="criaturas">Creatures</option>
        <option value="animales">Animals</option>
      </select>
      <span id="connection-status" class="status-dot idle" title="Polling every 2.5s"></span>
    </div>
  </header>

  <main>
    <section class="office-panel">
      <div class="panel-title-row">
        <h2 id="scene-title">Office</h2>
        <span id="session-count" class="muted">0 sessions</span>
      </div>
      <div id="office-scene" class="office-scene"></div>
      <div class="scene-legend" id="scene-legend"></div>
    </section>

    <aside class="sidebar-panel">
      <section>
        <h2>Timeline</h2>
        <div id="timeline-list" class="timeline-list"></div>
      </section>

      <section>
        <h2>Session Detail</h2>
        <div id="session-detail" class="session-detail empty">Select an avatar to view session history.</div>
      </section>
    </aside>
  </main>

  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
