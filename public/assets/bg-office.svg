<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#152035"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f15"/>
      <stop offset="100%" stop-color="#1e150e"/>
    </linearGradient>
    <linearGradient id="window-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3060"/>
      <stop offset="100%" stop-color="#2a4880"/>
    </linearGradient>
  </defs>
  <!-- Wall -->
  <rect width="800" height="250" fill="url(#wall)"/>
  <!-- Floor -->
  <rect y="250" width="800" height="250" fill="url(#floor)"/>
  <!-- Baseboard -->
  <rect y="246" width="800" height="8" fill="#3a2a1a" opacity="0.6"/>
  <!-- Windows -->
  <rect x="80" y="30" width="120" height="160" rx="4" fill="url(#window-sky)" opacity="0.7"/>
  <rect x="82" y="32" width="116" height="156" rx="3" fill="none" stroke="#4a6a8a" stroke-width="2"/>
  <line x1="140" y1="32" x2="140" y2="188" stroke="#4a6a8a" stroke-width="1.5"/>
  <line x1="82" y1="110" x2="198" y2="110" stroke="#4a6a8a" stroke-width="1.5"/>
  <rect x="340" y="30" width="120" height="160" rx="4" fill="url(#window-sky)" opacity="0.7"/>
  <rect x="342" y="32" width="116" height="156" rx="3" fill="none" stroke="#4a6a8a" stroke-width="2"/>
  <line x1="400" y1="32" x2="400" y2="188" stroke="#4a6a8a" stroke-width="1.5"/>
  <line x1="342" y1="110" x2="458" y2="110" stroke="#4a6a8a" stroke-width="1.5"/>
  <rect x="600" y="30" width="120" height="160" rx="4" fill="url(#window-sky)" opacity="0.7"/>
  <rect x="602" y="32" width="116" height="156" rx="3" fill="none" stroke="#4a6a8a" stroke-width="2"/>
  <line x1="660" y1="32" x2="660" y2="188" stroke="#4a6a8a" stroke-width="1.5"/>
  <line x1="602" y1="110" x2="718" y2="110" stroke="#4a6a8a" stroke-width="1.5"/>
  <!-- Stars in windows -->
  <circle cx="110" cy="60" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="170" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="380" cy="55" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="430" cy="75" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="640" cy="65" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="690" cy="50" r="1" fill="#fff" opacity="0.4"/>
  <!-- Ceiling light strips -->
  <rect x="200" y="8" width="160" height="3" rx="1.5" fill="#69b2ff" opacity="0.3"/>
  <rect x="440" y="8" width="160" height="3" rx="1.5" fill="#69b2ff" opacity="0.3"/>
  <!-- Floor pattern (wood-like) -->
  <g opacity="0.15">
    <line x1="0" y1="300" x2="800" y2="300" stroke="#5a4020" stroke-width="0.5"/>
    <line x1="0" y1="340" x2="800" y2="340" stroke="#5a4020" stroke-width="0.5"/>
    <line x1="0" y1="380" x2="800" y2="380" stroke="#5a4020" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#5a4020" stroke-width="0.5"/>
    <line x1="0" y1="460" x2="800" y2="460" stroke="#5a4020" stroke-width="0.5"/>
  </g>
</svg>
